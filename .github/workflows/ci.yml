name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          QUEUED: ${{ contains(github.event.pull_request.labels.*.name, 'mq-live') }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$QUEUED" != "true" ]; then
            echo "tests=affected" >> "$GITHUB_OUTPUT"
          else
            echo "tests=full" >> "$GITHUB_OUTPUT"
          fi
          echo "event=$EVENT queued=$QUEUED"

  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint

  tests:
    name: Tests
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Affected tests
        if: needs.scope.outputs.tests == 'affected'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tools/affected.ts --base "$BASE" --head "$HEAD" --run
      - name: Full suite, one process per file
        if: needs.scope.outputs.tests == 'full'
        run: npm run test:isolated

  result:
    name: CI result
    needs: [scope, static, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

  experiment:
    name: Experiment ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [isolated4, isolated8, shard4, shard4semi, shard4expose]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: nproc; free -g; node --version; node -e "console.log(require('v8').getHeapStatistics().heap_size_limit/1e6)"
      - if: matrix.variant == 'isolated4'
        run: time npm run -s test:isolated > out.txt; tail -3 out.txt
      - if: matrix.variant == 'isolated8'
        run: time node --test --test-concurrency=8 'sim/**/*.test.ts' 'src/**/*.test.ts' 'test/**/*.test.ts' 'tools/**/*.test.ts' > out.txt; tail -3 out.txt
      - if: matrix.variant == 'shard4'
        run: time node tools/affected.ts --all --run --jobs 4 > out.txt; tail -1 out.txt
      - if: matrix.variant == 'shard4semi'
        run: time NODE_OPTIONS=--max-semi-space-size=64 node tools/affected.ts --all --run --jobs 4 > out.txt; tail -1 out.txt
      - if: matrix.variant == 'shard4expose'
        run: |
          NODE_OPTIONS=--trace-gc node --test --experimental-test-isolation=none sim/audio.test.ts sim/world/step.test.ts > gc.txt 2>&1 || true
          grep -c Mark-Compact gc.txt; grep -c Scavenge gc.txt; grep -E "Mark-Compact" gc.txt | tail -3
          time node --test --experimental-test-isolation=none --test-reporter=spec sim/audio.test.ts | tail -12
          time node --test --test-reporter=spec sim/audio.test.ts | tail -12
