name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}${{ github.event.action == 'labeled' && github.event.label.name != 'mq-live' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: ${{ (github.event.action == 'labeled' && github.event.label.name != 'mq-live') && 'CI scope (label event, not run)' || 'CI scope' }}
    if: github.event.action != 'labeled' || github.event.label.name == 'mq-live'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          QUEUED: ${{ contains(github.event.pull_request.labels.*.name, 'mq-live') }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "tests=isolated" >> "$GITHUB_OUTPUT"
          elif [ "$QUEUED" = "true" ]; then
            echo "tests=full" >> "$GITHUB_OUTPUT"
          else
            echo "tests=affected" >> "$GITHUB_OUTPUT"
          fi
          echo "event=$EVENT queued=$QUEUED"

  static:
    name: ${{ (github.event.action == 'labeled' && github.event.label.name != 'mq-live') && 'Typecheck and lint (label event, not run)' || 'Typecheck and lint' }}
    if: github.event.action != 'labeled' || github.event.label.name == 'mq-live'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      install: ${{ steps.install.outcome }}
      typecheck: ${{ steps.typecheck.outcome }}
      lint: ${{ steps.lint.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - id: install
        if: steps.modules.outputs.cache-hit != 'true'
        continue-on-error: ${{ vars.CI_GATE != 'on' }}
        run: npm ci --no-audit --no-fund
      - if: steps.install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - id: typecheck
        continue-on-error: ${{ vars.CI_GATE != 'on' }}
        run: npm run typecheck
      - id: lint
        continue-on-error: ${{ vars.CI_GATE != 'on' }}
        run: npm run lint

  tests:
    name: ${{ (github.event.action == 'labeled' && github.event.label.name != 'mq-live') && 'Tests (label event, not run)' || 'Tests' }}
    needs: scope
    if: github.event.action != 'labeled' || github.event.label.name == 'mq-live'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      install: ${{ steps.install.outcome }}
      affected: ${{ steps.affected.outcome }}
      full: ${{ steps.full.outcome }}
      isolated: ${{ steps.isolated.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - id: install
        if: steps.modules.outputs.cache-hit != 'true'
        continue-on-error: ${{ vars.CI_GATE != 'on' }}
        run: npm ci --no-audit --no-fund
      - if: steps.install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Affected tests
        id: affected
        continue-on-error: ${{ vars.CI_GATE != 'on' }}
        if: needs.scope.outputs.tests == 'affected'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tools/affected.ts --base "$BASE" --head "$HEAD" --run
      - name: Full suite
        id: full
        continue-on-error: ${{ vars.CI_GATE != 'on' }}
        if: needs.scope.outputs.tests == 'full'
        run: npm test
      - name: Full suite, one process per file
        id: isolated
        continue-on-error: ${{ vars.CI_GATE != 'on' }}
        if: needs.scope.outputs.tests == 'isolated'
        run: npm run test:isolated

  result:
    name: ${{ (github.event.action == 'labeled' && github.event.label.name != 'mq-live') && 'CI result (label event, not run)' || 'CI result' }}
    needs: [scope, static, tests]
    if: always() && (github.event.action != 'labeled' || github.event.label.name == 'mq-live')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GATE: ${{ vars.CI_GATE }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          STEPS: >-
            install=${{ needs.static.outputs.install }}
            typecheck=${{ needs.static.outputs.typecheck }}
            lint=${{ needs.static.outputs.lint }}
            tests-install=${{ needs.tests.outputs.install }}
            affected-tests=${{ needs.tests.outputs.affected }}
            full-suite=${{ needs.tests.outputs.full }}
            isolated-suite=${{ needs.tests.outputs.isolated }}
        run: |
          failed=""
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) failed="$failed job:$result" ;;
            esac
          done
          for step in $STEPS; do
            case "$step" in
              *=failure) failed="$failed ${step%=failure}" ;;
            esac
          done
          {
            echo "### CI result"
            echo
            if [ -z "$failed" ]; then echo "Everything passed."; else echo "Failed:$failed"; fi
            echo
            if [ "$GATE" = "on" ]; then echo "CI_GATE is on: a failure fails this check."; else echo "CI_GATE is off: failures are reported here and do not block landing."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$failed" ]; then exit 0; fi
          if [ "$GATE" = "on" ]; then
            echo "::error::Failed:$failed"
            exit 1
          fi
          echo "::warning::Failed (informational, CI_GATE is off):$failed"
